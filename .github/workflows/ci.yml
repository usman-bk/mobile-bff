name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - run: go build ./...
      - run: go vet ./...
      - name: Formatting
        run: |
          u=$(gofmt -l .)
          if [ -n "$u" ]; then echo "gofmt would change:"; echo "$u"; exit 1; fi

      # Without Redis first. The service has to be testable without it, and a
      # skip that becomes permanent is how that stops being true.
      - name: Test with nothing external
        run: go test -race ./...

      - name: Test against Redis
        env:
          REDIS_URL: redis://localhost:6379/9
        run: go test -race ./...
